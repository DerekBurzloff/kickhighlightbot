<!DOCTYPE html>
<html>
<head>
    <title>KickHighlightBot</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 50px; background: #0f0f0f; color: white; }
        h1 { color: #00ff88; }
        .status { font-size: 24px; margin: 30px; }
        button { padding: 20px 40px; margin: 15px; font-size: 18px; border: none; border-radius: 10px; cursor: pointer; }
        .start { background: #00cc00; color: white; }
        .stop { background: #cc0000; color: white; }
    </style>
</head>
<body>
    <h1>🚀 KickHighlightBot</h1>
    <div class="status">Status: <strong>{{ status }}</strong></div>
    <button class="start" onclick="startBot()">▶️ START BOT</button>
    <button class="stop" onclick="stopBot()">⛔ STOP BOT</button>

    <script>
        async function startBot() {
            await fetch('/start', {method: 'POST'});
            location.reload();
        }
        async function stopBot() {
            await fetch('/stop', {method: 'POST'});
            location.reload();
        }
    </script>
</body>
</html>
