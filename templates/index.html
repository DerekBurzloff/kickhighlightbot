<!DOCTYPE html>
<html>
<head>
    <title>KickHighlightBot Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 40px; background: #111; color: #fff; }
        h1 { color: #00ff00; }
        .status { font-size: 1.5em; margin: 20px; }
        button { padding: 15px 30px; margin: 10px; font-size: 1.2em; border: none; border-radius: 8px; cursor: pointer; }
        .start { background: #00cc00; color: white; }
        .stop { background: #cc0000; color: white; }
    </style>
</head>
<body>
    <h1>🚀 KickHighlightBot - kaesonnguns (R6 Siege)</h1>
    <div class="status">Status: <strong>{{ status }}</strong></div>
    
    <button class="start" onclick="startBot()">▶️ START BOT</button>
    <button class="stop" onclick="stopBot()">⛔ STOP BOT</button>

    <script>
        async function startBot() {
            await fetch('/start', { method: 'POST' });
            location.reload();
        }
        async function stopBot() {
            await fetch('/stop', { method: 'POST' });
            location.reload();
        }
    </script>
</body>
</html>
