<!DOCTYPE html>
<html>
<head>
    <title>KickHighlightBot Dashboard</title>
    <style>
        body { font-family: Arial; background: #0f0f0f; color: white; padding: 20px; }
        h1 { color: #00ff00; }
        .clip { margin: 10px 0; padding: 10px; background: #1f1f1f; border-radius: 8px; }
    </style>
</head>
<body>
    <h1>🚀 KickHighlightBot</h1>
    <p><strong>Channel:</strong> {{ channel }} (Rainbow Six Siege)</p>
    <p><strong>TikTok:</strong> @{{ tiktok }}</p>
    <p><strong>Status:</strong> {{ status }}</p>

    <h2>Recent Clips</h2>
    {% if recent_clips %}
        {% for clip in recent_clips %}
        <div class="clip">
            📹 {{ clip }}
        </div>
        {% endfor %}
    {% else %}
        <p>No clips yet. Run some tests!</p>
    {% endif %}
</body>
</html>
